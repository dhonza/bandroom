name: CI

on:
  # Documentation-only changes skip CI; a push that touches any other file runs it in full.
  push:
    branches: [main]
    paths-ignore: &docs-only
      - "docs/**"
      - "research/**"
      - "**/*.md"
  pull_request:
    paths-ignore: *docs-only
  # release.yml runs the whole suite before it builds and pushes an image.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install ffmpeg and poppler (ingest and document tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Type-aware linting of all workspaces peaks at ~3.3 GB; the runner's default heap is smaller.
      - run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm typecheck
      - name: Deploy scripts (shellcheck, tests against a fake docker)
        run: |
          shellcheck deploy/deploy.sh deploy/status.sh deploy/ops-watcher.sh deploy/test/deploy.test.sh deploy/test/fake-docker packages/stretch/scripts/build-wasm.sh
          bash deploy/test/deploy.test.sh
      - run: pnpm test:coverage
      - run: pnpm i18n:check
      - run: pnpm build
      - name: Dependency audit (warning only)
        run: pnpm audit --prod
        continue-on-error: true

  stretch-wasm:
    # The committed packages/stretch/src/stretch.wasm must be exactly what the pinned emscripten
    # image builds from packages/stretch/native (SPEC §30.1). ~1 GB image pull, seconds to build.
    name: Stretch WASM reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: packages/stretch/scripts/build-wasm.sh --check

  e2e:
    # One job per Playwright project, in parallel: the whole suite in one job took ~45–60 min and
    # hit the job timeout. Each job starts its own root and sub-path stacks.
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    # A hung browser or server must not hold a runner for the 6 h default.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project:
          [chromium, webkit, iphone, pixel, subpath-chromium, subpath-iphone, iphone-landscape]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install ffmpeg and poppler (worker in the e2e stack)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Browsers live in ./.cache/ms-playwright (see test:e2e:install), keyed on the version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: .cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm test:e2e:install --with-deps
      - name: Install Playwright system dependencies (browsers cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit
      - run: pnpm test:e2e --project=${{ matrix.project }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: bandroom:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name br -p 3000:3000 \
            -e APP_URL=http://localhost:3000 -e APP_SECRET=ci-only-insecure-secret-0123456789abcdef \
            -e INTERNAL_EVENTS_SECRET=ci-only-internal-secret-0123456789abcdef \
            bandroom:ci
          docker exec br ffmpeg -hide_banner -f lavfi -i sine=d=1 -af aresample=48000:resampler=soxr -c:a libopus -f null -
          docker exec br ffmpeg -hide_banner -f lavfi -i sine=d=1 -c:a wavpack -sample_fmt fltp -f null -
          docker exec br node -e "require('/app/apps/worker/node_modules/sharp')"
          docker exec br pdftoppm -v
          docker exec br pdfinfo -v
          docker exec br sh -c 'cd /app/deploy && ls -l deploy.sh status.sh compose.yml Caddyfile Caddyfile.subpath ops-watcher.sh bandroom-ops.path bandroom-ops.service bandroom-ops.timer'
          for i in $(seq 1 30); do curl -fsS localhost:3000/healthz && exit 0; sleep 1; done
          docker logs br; exit 1
